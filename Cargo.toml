[workspace]
members = [
    "crates/field",
    "crates/challenger",
    "crates/multilinear-util",
    "crates/keccak",
    "crates/symmetric",
    "crates/matrix",
    "crates/util",
    "crates/maybe-rayon",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
keywords = ["cryptography", "zero-knowledge", "proofs"]
categories = ["cryptography"]

[workspace.dependencies]
itertools = { version = "0.15.0", default-features = false, features = ["use_alloc"] }
num-bigint = { version = "0.5.1", default-features = false }
paste = "1.0.15"
rand = "0.10.3"
rayon = "1.12.0"
serde = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
tiny-keccak = "2.0.2"
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }

[package]
name = "sumcheck_benchmark"
version = "0.1.0"
edition = "2024"

[dependencies]
p3-field = { path = "crates/field" }
p3-challenger = { path = "crates/challenger" }
p3-multilinear-util = { path = "crates/multilinear-util" }
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "sumcheck_full"
harness = false

[[bench]]
name = "sumcheck_prover"
harness = false